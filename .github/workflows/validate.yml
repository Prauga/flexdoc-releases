name: Validate FlexDoc release feed

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON Schemas
        run: |
          npx --yes ajv-cli@5 validate --strict=false -s schema/manifest.schema.json -d manifest.json
          npx --yes ajv-cli@5 validate --strict=false -s schema/releases.schema.json -d releases.json

      - name: Validate feed consistency
        run: node scripts/validate.mjs
